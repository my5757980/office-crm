name: Deploy to cPanel

on:
  push:
    branches: [main]

jobs:
  deploy:
    if: github.repository == 'my5757980/sbk-crm'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build (webpack)
        run: npx next build --webpack

      - name: Package build output
        run: tar -czf next-build.tar.gz .next

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Upload build and package files to server
        run: |
          scp -i ~/.ssh/deploy_key -P ${{ secrets.SSH_PORT }} next-build.tar.gz package.json package-lock.json \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/${{ secrets.SSH_USER }}/crmglobal.sbkautotrading.com/

      - name: Extract, install deps and restart on server
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} '
            source /home/${{ secrets.SSH_USER }}/nodevenv/crmglobal.sbkautotrading.com/20/bin/activate &&
            cd /home/${{ secrets.SSH_USER }}/crmglobal.sbkautotrading.com &&
            rm -rf .next &&
            tar -xzf next-build.tar.gz &&
            chmod -R 777 .next &&
            npm install --omit=dev &&
            mkdir -p tmp &&
            touch tmp/restart.txt
          '
